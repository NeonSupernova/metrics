name: Publish image
# Builds the action's Docker image once and publishes it to GHCR so that
# `uses: <owner>/metrics@...` pulls it instead of rebuilding on every run.
on:
  push:
    branches: [master, main]
    paths: [Dockerfile, package.json, package-lock.json, source/**, action.yml, .github/workflows/publish-image.yml]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: meta
        run: |
          echo "version=$(grep -Po '(?<="version": ").*(?=")' package.json)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/metrics" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Tag must match what action.yml pulls: forked-<package.json version>
          tags: |
            ${{ steps.meta.outputs.image }}:forked-${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
